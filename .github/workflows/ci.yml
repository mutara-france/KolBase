# Vérifications automatiques de chaque pull request et de chaque commit sur main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kolbase
          POSTGRES_PASSWORD: kolbase
          POSTGRES_DB: kolbase
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://kolbase:kolbase@localhost:5432/kolbase
      APP_URL: http://localhost:3000
      DEMO_PASSWORD: demo-ci-mot-de-passe-1
      NEXT_TELEMETRY_DISABLED: "1"
      # Parcours de bout en bout : administrateur KolBase de démo et faux services externes (tests/e2e/faux-services.mjs).
      PLATFORM_ADMIN_EMAILS: anne.chevalier@demo.kolbase.local
      SIREN_API_URL: http://localhost:3998
      ORCID_BASE_URL: http://localhost:3997
      ORCID_PUB_API_URL: http://localhost:3997/v3.0
      ORCID_CLIENT_ID: test
      ORCID_CLIENT_SECRET: test
      SMTP_URL: smtp://localhost:2525
      MAIL_FROM: KolBase <test@kolbase.fr>
      MAIL_DELIVER_RESERVED: "1"
      S3_ENDPOINT: http://localhost:3996
      S3_BUCKET: kolbase-test
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_FORCE_PATH_STYLE: "1"
      YOUSIGN_API_KEY: test
      YOUSIGN_API_URL: http://localhost:3995
      YOUSIGN_WEBHOOK_SECRET: test
      # Assistant de rédaction : faux service d'IA (tests/e2e/faux-services.mjs).
      ANTHROPIC_API_KEY: test
      ANTHROPIC_BASE_URL: http://localhost:3994
      CRON_SECRET: secret-des-taches-de-test
      # Facturation : faux Stripe (tests/e2e/faux-services.mjs).
      STRIPE_SECRET_KEY: test
      STRIPE_WEBHOOK_SECRET: whsec_test
      STRIPE_API_URL: http://localhost:3993
      # Double authentification facultative pour l'administrateur de test (obligatoire par défaut).
      PLATFORM_ADMIN_2FA: optional
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Types
        run: npm run lint
      - name: Tests unitaires
        run: npm test

      - name: Migrations
        run: npx prisma migrate deploy
      - name: Migrations conformes au schéma Prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Données de démonstration
        run: npm run db:seed
      # La mise en production relance la démo sur une base déjà remplie : le chargement doit être rejouable.
      - name: Données de démo (second passage, idempotence)
        run: npm run db:seed
      # Comme au déploiement : logos des organisations partenaires (deux passages, sans remplacement).
      - name: Logos des partenaires
        run: node scripts/partner-logos.mjs && node scripts/partner-logos.mjs

      - name: Build
        run: npm run build
      - name: Dépendances de production (vulnérabilités hautes ou critiques)
        run: npm audit --omit=dev --audit-level=high

      - name: Navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Parcours de bout en bout
        run: |
          npm start > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          BASE=http://localhost:3000 npm run test:e2e
      - name: Journal du serveur (en cas d'échec)
        if: failure()
        run: tail -n 200 next.log || true

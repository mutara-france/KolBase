# Vérifications automatiques de chaque pull request et de chaque commit sur main.
#
# Minutes de GitHub Actions (comptées sur un dépôt privé) : la suite complète (navigateur : mise en page, accessibilité,
# parcours) passe une fois par pull request prête ; une pull request en brouillon ne passe que les vérifications
# rapides. À la fusion, un commit de main identique (même arbre) à ce que la pull request a vérifié ne repasse pas la
# suite (job « deja-teste ») : Render, qui attend des vérifications réussies, compte les jobs sautés comme réussis.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "README.md", "CLAUDE.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "CLAUDE.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Commit poussé sur main : son arbre a-t-il déjà été vérifié en entier dans sa pull request (fusion de la pull request
  # dans main, notée par le job « arbre-verifie » sur son dernier commit) ? Oui si main n'a pas bougé entre la dernière
  # vérification et la fusion ; sinon (autre fusion entre-temps, commit poussé à la main), tout repasse.
  deja-teste:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      verifie: ${{ steps.arbre.outputs.verifie }}
    steps:
      - uses: actions/checkout@v7
      - name: Arbre déjà vérifié dans la pull request ?
        id: arbre
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arbre=$(git rev-parse 'HEAD^{tree}')
          verifie=false
          for tete in $(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[] | select(.merged_at != null) | .head.sha'); do
            teste=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tete/statuses" --jq '[.[] | select(.context == "CI / arbre vérifié")][0].description // ""')
            echo "Pull request (dernier commit $tete) : arbre vérifié « $teste » ; main : « $arbre »"
            if [ -n "$teste" ] && [ "$teste" = "$arbre" ]; then verifie=true; fi
          done
          echo "verifie=$verifie" >> "$GITHUB_OUTPUT"

  verifier:
    needs: deja-teste
    if: ${{ !cancelled() && needs.deja-teste.outputs.verifie != 'true' }}
    runs-on: ubuntu-latest
    # Environ 15 minutes d'habitude ; marge pour une installation lente du navigateur de test (14 minutes le 6 novembre).
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kolbase
          POSTGRES_PASSWORD: kolbase
          POSTGRES_DB: kolbase
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://kolbase:kolbase@localhost:5432/kolbase
      APP_URL: http://localhost:3000
      DEMO_PASSWORD: demo-ci-mot-de-passe-1
      NEXT_TELEMETRY_DISABLED: "1"
      # Parcours de bout en bout : administrateur KolBase de démo et faux services externes (tests/e2e/faux-services.mjs).
      PLATFORM_ADMIN_EMAILS: anne.chevalier@demo.kolbase.local
      SIREN_API_URL: http://localhost:3998
      GOOGLE_FILES_URL: http://localhost:3998
      ORCID_BASE_URL: http://localhost:3997
      ORCID_PUB_API_URL: http://localhost:3997/v3.0
      ORCID_CLIENT_ID: test
      ORCID_CLIENT_SECRET: test
      SMTP_URL: smtp://localhost:2525
      MAIL_FROM: KolBase <test@kolbase.fr>
      MAIL_DELIVER_RESERVED: "1"
      S3_ENDPOINT: http://localhost:3996
      S3_BUCKET: kolbase-test
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_FORCE_PATH_STYLE: "1"
      YOUSIGN_API_KEY: test
      YOUSIGN_API_URL: http://localhost:3995
      YOUSIGN_WEBHOOK_SECRET: test
      # Assistant de rédaction : faux service d'IA (tests/e2e/faux-services.mjs).
      ANTHROPIC_API_KEY: test
      ANTHROPIC_BASE_URL: http://localhost:3994
      CRON_SECRET: secret-des-taches-de-test
      # Facturation : faux Stripe (tests/e2e/faux-services.mjs).
      STRIPE_SECRET_KEY: test
      STRIPE_WEBHOOK_SECRET: whsec_test
      STRIPE_API_URL: http://localhost:3993
      # Double authentification facultative pour l'administrateur de test (obligatoire par défaut).
      PLATFORM_ADMIN_2FA: optional
      # Suite complète (navigateur) : partout sauf sur une pull request en brouillon.
      COMPLET: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Types
        run: npm run lint
      # Lint : erreurs de hooks React, variables inutilisées, pièges courants (configuration : biome.json).
      - name: Lint
        run: npm run check
      # Fichiers, exports et dépendances inutilisés (configuration : knip.json).
      - name: Code mort
        run: npm run deadcode
      # Tests unitaires, avec une couverture minimale des modules de règles (vitest.config.mts).
      - name: Tests unitaires
        run: npm run test:coverage

      - name: Migrations
        run: npx prisma migrate deploy
      - name: Migrations conformes au schéma Prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Données de démonstration
        run: npm run db:seed
      # La mise en production relance la démo sur une base déjà remplie : le chargement doit être rejouable.
      - name: Données de démo (second passage, idempotence)
        run: npm run db:seed
      # Comme au déploiement : logos des organisations partenaires (deux passages, sans remplacement).
      - name: Logos des partenaires
        run: node scripts/partner-logos.mjs && node scripts/partner-logos.mjs

      - name: Build
        run: npm run build
      - name: Dépendances de production (vulnérabilités hautes ou critiques)
        run: npm audit --omit=dev --audit-level=high

      - name: Navigateur de test
        if: env.COMPLET == 'true'
        run: npx playwright install --with-deps chromium
      - name: Application lancée
        id: app
        if: env.COMPLET == 'true'
        run: |
          npm start > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          curl -sf http://localhost:3000/api/health > /dev/null
      # Mise en page (débordements, blocs collés, champs sans style) sur la démo intacte, avant le parcours.
      - name: Mise en page
        if: env.COMPLET == 'true'
        run: BASE=http://localhost:3000 npm run test:affichage
      # Accessibilité (axe-core, WCAG 2.1 A et AA) des pages publiques, praticien, organisation et administration :
      # échec sur une violation critique ou grave. Avant le parcours, qui modifie les comptes de démonstration.
      - name: Accessibilité
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: BASE=http://localhost:3000 npm run test:a11y
      - name: Parcours de bout en bout
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: BASE=http://localhost:3000 npm run test:e2e
      - name: Journal du serveur (en cas d'échec)
        if: failure()
        run: tail -n 200 next.log || true

  # Mise à jour d'une base en service, comme au déploiement : la version précédente (base de la pull request, ou
  # commit précédent sur main) est installée et remplie avec la démo, puis cette version y applique ses migrations
  # avec le même script que Render (scripts/predeploy.sh). Le job « verifier » part d'une base vide : il n'aurait pas
  # vu l'échec du 4 novembre (calcul TVA en entiers 32 bits, « integer out of range » sur des montants réels).
  montee-de-version:
    needs: deja-teste
    if: ${{ !cancelled() && needs.deja-teste.outputs.verifie != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kolbase
          POSTGRES_PASSWORD: kolbase
          POSTGRES_DB: kolbase
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://kolbase:kolbase@localhost:5432/kolbase
      DEMO_PASSWORD: demo-ci-mot-de-passe-1
      SEED_DEMO: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PRECEDENTE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Une migration ajoutée doit passer après toutes celles déjà en service : « prisma migrate deploy » appliquerait
      # sans rien dire une migration classée avant, dans un ordre différent de celui des bases neuves.
      - name: Nouvelles migrations après celles en service
        run: |
          derniere=$(git ls-tree --name-only "$PRECEDENTE" prisma/migrations/ | xargs -n1 basename | grep -E '^[0-9]' | sort | tail -1)
          echo "Dernière migration en service : $derniere"
          fautives=$(comm -13 <(git ls-tree --name-only "$PRECEDENTE" prisma/migrations/ | xargs -n1 basename | sort) <(ls prisma/migrations | sort) | grep -E '^[0-9]' | awk -v d="$derniere" '$0 <= d')
          if [ -n "$fautives" ]; then echo "Migrations classées avant $derniere (renommer avec un horodatage plus récent) :"; echo "$fautives"; exit 1; fi

      - name: Version précédente, base remplie comme en production
        run: |
          git worktree add "$RUNNER_TEMP/precedente" "$PRECEDENTE"
          cd "$RUNNER_TEMP/precedente"
          npm ci
          npx prisma generate
          sh scripts/predeploy.sh

      - name: Cette version, appliquée à cette base (script de déploiement)
        run: |
          npm ci
          npx prisma generate
          sh scripts/predeploy.sh
      - name: Base conforme au schéma Prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  # Pull request prête, vérifiée en entier (les deux jobs) : l'arbre vérifié (fusion de la pull request dans main) est
  # noté sur son dernier commit, pour que le commit de main qui lui sera identique ne repasse pas la suite.
  arbre-verifie:
    needs: [verifier, montee-de-version]
    # Condition explicite : sur une pull request, « deja-teste » (dont dépendent les deux jobs) est sauté, ce qui
    # suffirait à faire sauter ce job avec la condition implicite success().
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.verifier.result == 'success' && needs.montee-de-version.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - name: Arbre vérifié, noté sur le dernier commit de la pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TETE: ${{ github.event.pull_request.head.sha }}
        run: |
          arbre=$(git rev-parse 'HEAD^{tree}')
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TETE" -f state=success -f context="CI / arbre vérifié" -f description="$arbre" --silent
          echo "Arbre vérifié : $arbre"

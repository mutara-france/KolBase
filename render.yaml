# Infrastructure Render de KolBase (Blueprint).
# Région Francfort : données hébergées dans l'Union européenne.

databases:
  - name: kolbase-db
    databaseName: kolbase
    user: kolbase
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    ipAllowList: [] # accès uniquement depuis le réseau privé Render

services:
  - type: web
    name: kolbase-web
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    # Phase de démarrage : synchronise le schéma. À remplacer par
    # « npm run db:migrate » dès que les migrations Prisma sont versionnées.
    preDeployCommand: npx prisma db push
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: kolbase-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false

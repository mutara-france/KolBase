# Infrastructure Render de KolBase (Blueprint).
# Région Francfort : données hébergées dans l'Union européenne.

databases:
  - name: kolbase-db
    databaseName: kolbase
    user: kolbase
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    ipAllowList: [] # accès uniquement depuis le réseau privé Render

services:
  - type: web
    name: kolbase-web
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    # Migrations versionnées (prisma/migrations) + données de démo si SEED_DEMO=1.
    preDeployCommand: npm run deploy:prepare
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: kolbase-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      # Données fictives de démonstration (mettre à 0 avant l'ouverture au public).
      - key: SEED_DEMO
        value: "1"
      # Mot de passe commun des comptes de démo : à saisir dans le tableau de bord Render.
      - key: DEMO_PASSWORD
        sync: false
      # Comptes réels à rendre administrateurs des organisations de démo (e-mails séparés par des virgules).
      - key: DEMO_ADMIN_EMAILS
        sync: false

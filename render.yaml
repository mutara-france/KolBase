# Infrastructure Render de KolBase (Blueprint).
# Région Francfort : données hébergées dans l'Union européenne.

databases:
  - name: kolbase-db
    databaseName: kolbase
    user: kolbase
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    ipAllowList: [] # accès uniquement depuis le réseau privé Render

services:
  - type: web
    name: kolbase-web
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    # Déploiement seulement quand les vérifications GitHub (CI) du commit ont réussi.
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    # Migrations versionnées (prisma/migrations) + données de démo si SEED_DEMO=1.
    preDeployCommand: npm run deploy:prepare
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: kolbase-db
          property: connectionString
      - key: APP_URL
        sync: false
      # Données fictives de démonstration (mettre à 0 avant l'ouverture au public, puis npm run db:purge-demo).
      - key: SEED_DEMO
        value: "1"
      # Mot de passe commun des comptes de démo : à saisir dans le tableau de bord Render.
      - key: DEMO_PASSWORD
        sync: false
      # Comptes réels à rendre administrateurs des organisations de démo (e-mails séparés par des virgules).
      - key: DEMO_ADMIN_EMAILS
        sync: false
      # Administrateurs de la plateforme (validation des organisations et des RPPS, page /admin) :
      # e-mails de comptes déjà créés, séparés par des virgules.
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      # Connexion ORCID (facultatif) : application déclarée sur https://orcid.org/developer-tools,
      # URL de redirection <APP_URL>/compte/orcid/retour. Sans ces variables, l'iD se saisit à la main.
      - key: ORCID_CLIENT_ID
        sync: false
      - key: ORCID_CLIENT_SECRET
        sync: false
      # E-mails (mot de passe oublié, confirmation d'adresse, notifications) : accès SMTP du prestataire
      # d'envoi (Brevo, Postmark…), ex. smtps://identifiant:motdepasse@smtp-relay.brevo.com:465,
      # et expéditeur d'un domaine dont les DNS (SPF, DKIM) sont configurés chez ce prestataire.
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Documents des dossiers : stockage objet S3 compatible, compartiment privé hébergé dans l'UE
      # (Scaleway, OVHcloud…). Sans ces variables, le dépôt de documents est désactivé.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Signature électronique des conventions (facultatif) : clé d'API Yousign v3 (YOUSIGN_API_URL vide = production,
      # https://api-sandbox.yousign.app/v3 pour le bac à sable), et secret du webhook déclaré chez Yousign vers
      # <APP_URL>/api/signature/webhook (signature_request.done, .declined, .expired, .canceled). Sans clé : signature sur papier.
      - key: YOUSIGN_API_KEY
        sync: false
      - key: YOUSIGN_API_URL
        sync: false
      - key: YOUSIGN_WEBHOOK_SECRET
        sync: false
      # Secret des tâches planifiées (rappels de la veille, attestations et questionnaires après l'événement),
      # partagé avec le service cron ci-dessous.
      - key: CRON_SECRET
        generateValue: true
      # Facturation (abonnements) : clé secrète Stripe, secret de la notification déclarée chez Stripe vers
      # <APP_URL>/api/stripe/webhook (checkout.session.completed, customer.subscription.*, invoice.payment_failed),
      # et identifiant du taux de TVA à appliquer (txr_…, facultatif). Sans clé : aucune facturation.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_TAX_RATE
        sync: false

  # Tâches planifiées : toutes les heures, rappels de la veille puis attestations et questionnaires après
  # les événements (POST /api/taches, idempotent).
  - type: cron
    name: kolbase-taches
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "7 * * * *"
    buildCommand: "true"
    # Sans APP_URL, curl échouait sans rien dire d'utile (« URL using bad/illegal format ») : depuis la création du
    # service le 3 novembre, aucune tâche n'avait tourné. Le message nomme désormais la variable manquante.
    # Une redirection (adresse à corriger) fait échouer l'appel au lieu de passer pour un succès (-L --max-redirs 0).
    # Pas de délai maximal : un nouvel essai pendant que la première exécution tourne encore ferait doublon.
    startCommand: 'curl -fsS -L --max-redirs 0 --retry 2 -X POST -H "Authorization: Bearer $CRON_SECRET" "${APP_URL:?APP_URL manquant sur le service kolbase-taches}/api/taches"'
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: kolbase-web
          envVarKey: CRON_SECRET
      # Adresse publique de l'application (pas un secret) : fixée ici pour ne plus dépendre d'une saisie manuelle.
      - key: APP_URL
        value: https://kolbase.io
